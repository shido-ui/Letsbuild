name: ModuleIQ Phase 7 Mobile

on:
  push:
    branches:
      - transformation/phase-7-mobile-network
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
          CAPACITOR_ALLOW_CLEARTEXT: "true"
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Build Android
        working-directory: frontend
        env:
          CAPACITOR_ALLOW_CLEARTEXT: "true"
        run: |
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s frontend/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t frontend/android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
