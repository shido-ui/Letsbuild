name: ModuleIQ Completion Gate
on:
  workflow_dispatch:
  push:
    branches: [completion/apk-runtime-finish]
jobs:
  completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend regression
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q backend
          alembic upgrade head
          pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web verification
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm install
          npm run typecheck
          npm run build
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
      - name: Android project and web bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
          CAPACITOR_ALLOW_CLEARTEXT: "true"
        run: |
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build and signed QA package
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/moduleiq-release-qa.apk"
          keytool -genkeypair -v -keystore moduleiq-qa.jks -storepass moduleiq-qa -keypass moduleiq-qa -alias moduleiq -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=ModuleIQ QA,O=ModuleIQ,C=IN"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks moduleiq-qa.jks --ks-pass pass:moduleiq-qa --key-pass pass:moduleiq-qa --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s "$SIGNED"
      - name: Secret hygiene
        run: |
          ! grep -RInE 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|OPENAI_API_KEY=|GEMINI_API_KEY=' backend frontend --exclude-dir=node_modules --exclude-dir=android
      - uses: actions/upload-artifact@v4
        with:
          name: moduleiq-release-qa-apk
          path: frontend/android/app/build/outputs/apk/release/moduleiq-release-qa.apk
          if-no-files-found: error
          retention-days: 14
