name: ModuleIQ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build web application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
          CAPACITOR_ALLOW_CLEARTEXT: "true"
        run: |
          npm install
          npm run build
      - name: Generate Android project
        working-directory: frontend
        env:
          CAPACITOR_ALLOW_CLEARTEXT: "true"
        run: |
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s frontend/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t frontend/android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: moduleiq-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
