name: ModuleIQ Phase 14 Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q backend
      - name: Database migration
        run: |
          mkdir -p data
          alembic upgrade head
      - name: Tests
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          exit $status
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-test-log
          path: pytest.log
