name: ModuleIQ Phase 4 Vector Verification

on:
  push:
    branches: [phase-authentication]
  pull_request:
    branches: [phase-authentication]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate
        run: mkdir -p data && alembic upgrade head
      - name: Vector tests
        run: pytest -q backend/tests/test_vector_store.py backend/tests/test_search_engine.py
      - name: Backend regression
        run: pytest -q
