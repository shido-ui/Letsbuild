name: ModuleIQ V2 Phase 5 Deployment
on:
  push:
    branches: [target/v2-phase-5-deployment]
  workflow_dispatch:
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend and scripts
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p data
          python -m compileall -q backend
          alembic upgrade head
          pytest -q
          bash -n scripts/start-local.sh scripts/dev.sh scripts/termux-start.sh scripts/termux-stop.sh scripts/termux-install.sh
          python -m py_compile scripts/seed.py
      - name: Frontend build
        working-directory: frontend
        run: npm install && npm run typecheck && npm run build
      - name: Compose config
        run: docker compose config --quiet
