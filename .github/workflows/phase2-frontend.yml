name: ModuleIQ Phase 2 Frontend Verification

on:
  push:
    branches: [phase-authentication]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase2-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Backend compile
        run: python -m compileall -q backend/moduleiq backend/tests
      - name: Backend regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build
      - name: PWA artifacts
        run: |
          test -s frontend/dist/manifest.webmanifest
          test -s frontend/dist/sw.js
