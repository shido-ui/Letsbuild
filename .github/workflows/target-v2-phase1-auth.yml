name: ModuleIQ V2 Phase 1 Auth
on:
  push:
    branches: [target/v2-phase-1-auth]
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m compileall -q backend
          mkdir -p data
          alembic upgrade head
          pytest -q backend/tests/test_auth.py backend/tests/test_security_isolation.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend
        working-directory: frontend
        run: |
          npm install
          npm run typecheck
          npm run build
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
