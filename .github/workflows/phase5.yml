name: ModuleIQ Phase 5

on:
  push:
    branches:
      - transformation/phase-5-ingestion-production
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q backend/moduleiq backend/tests
      - name: Migrate
        run: mkdir -p data && alembic upgrade head
      - name: Test
        run: pytest -q
