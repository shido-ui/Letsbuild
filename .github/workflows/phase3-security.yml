name: ModuleIQ Phase 3 Security Verification

on:
  push:
    branches: [phase-authentication]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q backend/moduleiq backend/tests
      - name: Security tests
        run: pytest -q backend/tests/test_security_middleware.py backend/tests/test_auth.py
      - name: Full regression
        run: pytest -q
      - name: Ruff
        run: ruff check backend/moduleiq/core/middleware.py backend/tests/test_security_middleware.py
      - name: Dependency audit
        run: python -m pip check
