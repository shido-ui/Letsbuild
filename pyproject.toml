[project]
name = "moduleiq"
version = "0.1.0"
description = "Android-first AI knowledge workspace with BYOK/BYOM."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "huey>=3.4,<4",
  "python-multipart>=0.0.20",
  "pypdf>=6.1,<7",
  "sqlalchemy>=2.0.44,<2.1",
  "alembic>=1.17,<2",
]

[project.optional-dependencies]
document-engine = [
  "mineru==4.0.10",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "httpx>=0.28,<1",
  "ruff>=0.13,<0.14",
  "mypy>=1.18,<2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","B","UP"]

[tool.setuptools.packages.find]
where = ["backend"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
